[project]
name = "acme-guardana-outputs"
version = "0.1.0"
description = "Example third-party Guardana outputs (fictional company Acme): a CSV export and a signed webhook."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = ["Typing :: Typed"]
dependencies = ["guardana-core"]

[project.entry-points."guardana.renderers"]
acme-table = "acme_outputs:provide_table"

[project.entry-points."guardana.reporters"]
acme-webhook = "acme_outputs:provide_webhook"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_outputs"]
