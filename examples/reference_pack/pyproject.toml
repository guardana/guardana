[project]
name = "guardana-reference-pack"
version = "0.1.1"
description = "A Guardana extension pack that uses all six extension points through the supported surface only."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = ["Typing :: Typed"]
dependencies = ["guardana-core>=0.41"]

[project.urls]
Homepage = "https://guardana.dev"
Repository = "https://github.com/guardana/guardana"
Documentation = "https://guardana.dev/docs/"

[project.entry-points."guardana.rules"]
reference = "guardana_reference_pack:provide_rules"

[project.entry-points."guardana.evaluators"]
reference = "guardana_reference_pack:provide_evaluators"

[project.entry-points."guardana.targets"]
reference = "guardana_reference_pack:provide_targets"

[project.entry-points."guardana.taxonomies"]
reference = "guardana_reference_pack:provide_taxonomies"

[project.entry-points."guardana.renderers"]
reference-summary = "guardana_reference_pack:provide_summary"

[project.entry-points."guardana.reporters"]
reference-file = "guardana_reference_pack:provide_file_reporter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardana_reference_pack"]
