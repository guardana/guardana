name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least privilege: without this block the workflow inherits the repository default,
# which can be read-write, and a compromised action would hold a token that can push.
permissions:
  contents: read

jobs:
  test:
    # Ubuntu 26.04's archive carries no postgresql-client-16, and pg_dump has to match
    # the postgres:16 service below; moving this job means moving both together.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    # The collector's tests need a real PostgreSQL. They skip without one, so that
    # a contributor changing a rule does not have to run a database — and
    # GUARDANA_REQUIRE_POSTGRES below turns that skip into a failure here, because
    # "the isolation test did not run" reading as a green build is the same
    # fail-open this project refuses everywhere else.
    services:
      postgres:
        # Google's mirror of Docker Hub's official images: a shared runner address
        # often exhausts Docker Hub's anonymous pull limit, which failed every job here.
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_USER: guardana
          POSTGRES_PASSWORD: guardana
          POSTGRES_DB: guardana_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U guardana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GUARDANA_TEST_DATABASE_URL: postgresql://guardana:guardana@127.0.0.1:55439/guardana_test
      GUARDANA_REQUIRE_POSTGRES: "1"
      # Same asymmetry, for the backup/restore test's other prerequisite: without
      # the client tools it skips locally, and here it must not.
      GUARDANA_REQUIRE_PG_TOOLS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Version 16 on purpose: it has to match the service container above. A dump
      # taken by newer client tools does not restore into an older server — it
      # carries settings the server has never heard of — which is how a backup
      # passes every day and fails on the one day somebody needs it.
      - name: PostgreSQL client tools, matching the server
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy --strict .

      - name: Architecture (the engine must never depend on the collector)
        run: uv run lint-imports

      - name: Agent setup is consistent
        run: uv run python scripts/check_claude_setup.py

      - name: Tests + coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-report=json:.coverage.json

      # One global number lets simple new code pay for an untested parser. These
      # are the areas where being wrong is a wrong verdict or somebody else's
      # data, and each carries its own floor.
      - name: Critical-path coverage floors
        run: uv run python scripts/critical_coverage.py .coverage.json

      # We ship a supply-chain scanner; our own dependencies get the same scrutiny.
      - name: Dependency audit
        run: uv audit --preview-features audit

      # `scan .` would fail by design: examples/vulnerable-model is deliberately
      # malicious. Guardana scans its own source instead, and must stay clean.
      - name: Dogfood (Guardana scans its own source)
        run: uv run guardana scan packages --profile scripts/dogfood.yaml

  images:
    # The images are built on every push, not first at the tag. An entrypoint, a
    # missing extra or a non-root user that cannot read the mounted volume are
    # failure modes no Python test can see, and finding them while cutting a
    # release is finding them at the worst possible moment.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          cache-suffix: images

      # The images install the requirement files exported from uv.lock; a lock change
      # without a re-export would ship versions the test job never ran. The check reads
      # them with `packaging`, so it runs in the locked development environment.
      - name: Image requirements match uv.lock
        run: uv run --locked python scripts/export_image_requirements.py --check

      # The base images are pinned by digest, so the mirror serves the same bytes or
      # the build fails; Docker Hub stays the fallback when the mirror has no copy.
      - name: Pull Docker Hub images through Google's mirror
        run: |
          { sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}'; } \
            | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' > "$RUNNER_TEMP/daemon.json"
          sudo mv "$RUNNER_TEMP/daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'

      - name: Build both images and run them
        run: uv run --no-project python scripts/image_smoke.py

  clean-install:
    # Every other job runs where everything is installed — including modules
    # nothing declares. This one runs where nothing is: the five distributions in
    # an empty environment, then the commands the documentation tells people to
    # type. It is the only job that could have caught the defect that made 0.9.0
    # unshippable (`ModuleNotFoundError: click` on every command), and the
    # release workflow runs the same script before it publishes anything.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          cache-suffix: clean-install

      # --no-project on purpose: this must not depend on the development
      # environment resolving, because a user's install does not.
      - name: Install into an empty environment and run the documented commands
        run: uv run --no-project python scripts/clean_install_check.py

      # Generated here too, and verified, so the tag is not the first time the
      # release's supply-chain artifacts are produced. --check writes them to a
      # temporary directory and throws them away; the release keeps them.
      - name: The SBOMs generate and describe what they claim to
        run: uv run --no-project python scripts/generate_sbom.py --check

  example-plugin:
    # Proves the third-party extension story end-to-end: a package outside the
    # workspace registers rules through the `guardana.rules` entry point and is
    # discovered. Isolated on purpose — installing it into the main test env
    # would put `acme.*` rules into every discovery and skew the dogfood scan.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Every step below runs `--no-cache`, so `UV_CACHE_DIR` is never created and
      # setup-uv's post step would fail saving it; the default `auto` still enables the cache.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: false

      # `--no-cache`: uv otherwise serves a previously built wheel for the example,
      # and the data files inside it — the pack manifest, the YAML rules — are what a
      # change to the extension contract touches. `--refresh` does not pick that up.
      # This job is the only one that sees a third party's manifest and entry points
      # both real, so a stale wheel here is a green build about code nobody ran.
      - name: Run the example plugin's own tests against an installed Guardana
        run: >
          uv run --isolated --no-cache
          --with ./packages/guardana-core
          --with ./packages/guardana-rules
          --with ./packages/guardana-cli
          --with ./packages/guardana-report
          --with ./examples/custom_rule
          --with pytest
          pytest examples/custom_rule/tests -q

      # The integrator example never imports Hermes — its payloads are copied from
      # Hermes' documentation — so running it here depends on nobody else's release.
      # What it pins is the trace writer's public API seen from outside this repo:
      # the entry point, the hooks, and the file that comes out.
      - name: Run the integrator example's own tests against an installed Guardana
        run: >
          uv run --isolated --no-cache
          --with ./packages/guardana-core
          --with ./packages/guardana-rules
          --with ./examples/hermes_integrator
          --with pytest
          pytest examples/hermes_integrator/tests -q

      # The out-of-process shape, which is the one that proves the recording surface is
      # general: separate processes per event, appending to one file. Same rule about
      # dependencies — the payloads are copied, so nothing here installs somebody's agent.
      - name: Run the shell-hook example's own tests against an installed Guardana
        run: >
          uv run --isolated --no-cache
          --with ./packages/guardana-core
          --with ./packages/guardana-rules
          --with ./examples/shell_hook_integrator
          --with pytest
          pytest examples/shell_hook_integrator/tests -q

      # A reference application served on a local port: the probe drives the installed CLI
      # against it as a team would in CI, so the two checks over seeded data, their
      # controls and the doubles' trace are proven against a real HTTP endpoint.
      - name: Run the reference retrieval application's tests against an installed Guardana
        run: >
          uv run --isolated --no-cache
          --with ./packages/guardana-core
          --with ./packages/guardana-rules
          --with ./packages/guardana-cli
          --with ./packages/guardana-report
          --with ./examples/retrieval_pilot
          --with pytest
          pytest examples/retrieval_pilot/tests

      # An installed format and an installed reporter from a package Guardana does not
      # ship, selected through the CLI. The webhook receiver checks every delivery with
      # `standardwebhooks`, the specification's reference verifier, installed for the
      # tests only: nothing in the package imports it.
      - name: Run the output package's own tests against an installed Guardana
        run: >
          uv run --isolated --no-cache
          --with ./packages/guardana-core
          --with ./packages/guardana-rules
          --with ./packages/guardana-cli
          --with ./packages/guardana-report
          --with ./examples/output_pack
          --with standardwebhooks==1.1.0
          --with pytest
          pytest examples/output_pack/tests

      # Every extension point in one pack, imported only through the supported surface
      # and checked only by the commands and the conformance kit Guardana ships.
      - name: Run the reference pack's own tests against an installed Guardana
        run: >
          uv run --isolated --no-cache
          --with ./packages/guardana-core
          --with ./packages/guardana-rules
          --with ./packages/guardana-cli
          --with ./packages/guardana-report
          --with ./examples/reference_pack
          --with pytest
          pytest examples/reference_pack/tests

      # The example steps above prove a hand-written package still works. This one proves
      # the command that writes a pack from nothing does — installed, validated and
      # graded, with its own detector checked against a manifest that lies.
      - name: Scaffold a pack and prove it installs, validates and grades
        run: uv run python scripts/new_pack_check.py
