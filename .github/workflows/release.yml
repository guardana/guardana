# Publishes all five packages to PyPI on a version tag push (v0.1.0, v0.1.1, ...).
# The reference pack (`examples/reference_pack`, versioned on its own) is built in a job
# of its own after that publish and attached to every GitHub Release, and published to
# PyPI by a further job only once the repository variable REFERENCE_PACK_PYPI is `true`.
#
# Steady-state: this builds all five packages and uploads them via OIDC trusted
# publishing behind the "pypi" environment's approval gate — no API token in CI.
# Each of the 5 projects must have a trusted publisher pointed at this repo, this
# workflow file, and the "pypi" environment.
#
# NOTE on first-time setup: you cannot pre-register five *pending* publishers with
# this one shared (repo, workflow, environment) config — PyPI allows only one
# pending publisher per config. Bootstrap the projects once with a token upload,
# then add a normal trusted publisher to each. `skip-existing` below keeps re-runs
# idempotent.

name: Release

on:
  push:
    # Full version tags only (vX.Y.Z), so the moving major/minor tags used for the
    # Marketplace Action (v0.1, v1) don't re-trigger a publish when they move.
    tags: ["v*.*.*"]

# Every job states the scopes it needs; nothing else in this file may write.
permissions:
  contents: read

jobs:
  # A tag publishes only a commit CI has passed. `release.py` waits for that before
  # it creates the tag; this job holds the same line for a tag pushed any other way.
  # No run, a run that did not succeed, or a `gh` that cannot answer all stop here,
  # before the `pypi` approval is requested.
  ci-passed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read        # read the CI runs for this commit, nothing else
    steps:
      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          run=$(gh run list --workflow ci.yml --commit "$SHA" --event push --limit 1 \
            --json databaseId,status,conclusion \
            --jq '.[0] | select(.) | "\(.databaseId) \(.status) \(.conclusion)"')
          if [ -z "$run" ]; then
            echo "::error::No CI run exists for $SHA; a tag publishes only a commit CI has passed."
            exit 1
          fi
          read -r id status conclusion <<< "$run"
          if [ "$status" != "completed" ]; then
            gh run watch "$id" --exit-status > /dev/null || true
            conclusion=$(gh run view "$id" --json conclusion --jq .conclusion)
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI run $id for $SHA concluded '${conclusion:-unknown}', not success."
            exit 1
          fi
          echo "CI run $id passed on $SHA."

  publish:
    needs: ci-passed
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write      # OIDC trusted publishing, and signing the provenance
      contents: write      # create the GitHub Release
      attestations: write  # store the build provenance for the distributions

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Every later step names the release after the tag, so a tag that differs from the
      # packaged version (a typo, another spelling of a pre-release) stops before a build.
      - name: The tag names the version the packages carry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          packaged=$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/guardana-core/pyproject.toml)
          if [ -z "$packaged" ] || [ "${TAG#v}" != "$packaged" ]; then
            echo "::error::The tag $TAG does not name the packaged version '${packaged:-unreadable}'."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      # The last gate, and the only one that runs where a user runs: an empty
      # environment, the five distributions, the documented commands. 0.9.0 was
      # tagged without it and had to be cancelled mid-flight, because every other
      # gate passes in an environment where the missing module is installed for
      # some other reason.
      - name: A clean install works
        run: uv run --no-project python scripts/clean_install_check.py

      - name: Build all packages
        run: |
          mkdir -p dist
          for pkg in packages/*/; do
            uv build "$pkg" --out-dir dist/
          done

      # One SBOM per distribution, written to `sbom/` rather than `dist/` — the
      # publish step uploads everything in `dist/`, and PyPI takes wheels and
      # sdists, not JSON. Verified against each package's own metadata as it is
      # written, because the artifact is what ships.
      - name: Write an SBOM for each distribution
        run: uv run python scripts/generate_sbom.py

      # Signed, keyless, and verifiable with `gh attestation verify` — the answer
      # to "was this wheel built from that source, by that workflow". PyPI gets its
      # own PEP 740 attestation from the publish step below; this one is for the
      # artifacts attached to the GitHub Release and for anyone re-checking a wheel
      # they already have. Named by extension: `uv build` also leaves a
      # `.gitignore` in `dist/`, which is not something this workflow ships.
      - name: Attest what built these distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          # Idempotent re-runs: a version already on PyPI (e.g. bootstrapped by a
          # one-time token upload, or a re-tagged release) is skipped, not failed.
          skip-existing: true

      # After a successful publish, create the GitHub Release from the tag's
      # CHANGELOG section — so the Releases page (and the Marketplace listing) never
      # lags PyPI. Idempotent: the release is created if missing, and the SBOMs are
      # uploaded either way, so a re-run repairs absent assets.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { f=1; next }
            /^## \[/ && f { exit }
            f { print }
          ' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving its notes as they are"
          else
            # A PEP 440 pre-release (aN, bN, rcN, .devN) must not become the release the
            # Releases page and the Marketplace call latest; a .postN release may.
            flags=()
            case "$version" in *a[0-9]*|*b[0-9]*|*rc[0-9]*|*.dev[0-9]*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" --title "Guardana $TAG" --notes-file notes.md --verify-tag "${flags[@]}"
          fi
          gh release upload "$TAG" sbom/*.cdx.json --clobber

  # The reference pack in a job of its own, after the five packages are on PyPI and the
  # GitHub Release exists; the clean-install check in `publish` has already built and
  # checked it. It needs no `pypi` approval, because it publishes nowhere but the Release.
  reference-pack:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # attach the pack to the GitHub Release
      id-token: write      # sign the provenance
      attestations: write  # store the build provenance for the pack

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Build the reference pack
        run: uv build examples/reference_pack --out-dir dist-reference/

      - name: Attest what built the reference pack
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist-reference/*.whl
            dist-reference/*.tar.gz

      # A re-run keeps the first upload, as PyPI's skip-existing does, so the asset and
      # the index never hold different bytes under one version.
      - name: Attach the reference pack to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          attached=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for file in dist-reference/*.whl dist-reference/*.tar.gz; do
            name=$(basename "$file")
            if printf '%s\n' "$attached" | grep -qxF "$name"; then
              echo "::notice::$name is already attached to $TAG; the first upload is kept"
            else
              gh release upload "$TAG" "$file"
            fi
          done

  # The reference pack on PyPI, from the files attached to the GitHub Release, so what
  # PyPI receives is what was attested. Off until the owner registers the pending
  # trusted publisher for `guardana-reference-pack` and sets REFERENCE_PACK_PYPI; the
  # pack's version moves only when its content does, so a release that did not bump it
  # is skipped rather than failed.
  publish-reference-pack:
    needs: reference-pack
    if: vars.REFERENCE_PACK_PYPI == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read       # download the release assets
      id-token: write      # OIDC trusted publishing

    steps:
      - name: Download the reference pack from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --dir dist-reference \
            --pattern 'guardana_reference_pack-*.whl' \
            --pattern 'guardana_reference_pack-*.tar.gz'

      - name: Publish the reference pack to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist-reference/
          skip-existing: true

  # The two official images, published to the GitHub Container Registry after the
  # packages and behind the same single approval: an image tagged 0.10.0 that PyPI
  # never received is a version that exists in one place and not the other.
  images:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # sign the provenance attestation
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU (so the arm64 image is not an emulated afterthought)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      # Pulls go through Google's mirror of Docker Hub, whose anonymous limit a shared
      # runner address often exhausts; the digest-pinned base images cannot change.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag maths belongs in a tool, not in shell: `latest` and the moving
      # `X.Y` tag must not move for a prerelease, which is exactly the case a
      # hand-rolled `${TAG#v}` gets wrong once and nobody notices until it has.
      # `pep440`, not `semver`: a tag like v1.0.0rc1 is not semver, and a semver
      # rule would give the image no tag at all.
      - name: Work out the CLI image's tags
        id: cli-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/guardana/guardana
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}

      - name: Work out the collector image's tags
        id: collector-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/guardana/guardana-collector
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}

      # `sbom` and `provenance` are what make these images answerable in somebody
      # else's audit: both attestations are pushed alongside the image and can be
      # read back with `docker buildx imagetools inspect`. They are unsigned, so the
      # attest steps below sign a provenance statement per image digest, which is
      # what `gh attestation verify oci://…` checks.
      - name: Build and push the CLI image
        id: cli-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/cli.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.cli-meta.outputs.version }}
          tags: ${{ steps.cli-meta.outputs.tags }}
          labels: ${{ steps.cli-meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Build and push the collector image
        id: collector-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/collector.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.collector-meta.outputs.version }}
          tags: ${{ steps.collector-meta.outputs.tags }}
          labels: ${{ steps.collector-meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Attest what built the CLI image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/guardana/guardana
          subject-digest: ${{ steps.cli-build.outputs.digest }}
          push-to-registry: true

      - name: Attest what built the collector image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/guardana/guardana-collector
          subject-digest: ${{ steps.collector-build.outputs.digest }}
          push-to-registry: true
