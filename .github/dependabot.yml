version: 2
updates:
  # Keep the CI/release workflows' pinned actions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"

  # Dependabot supports uv workspaces natively (resolves the root
  # pyproject.toml + uv.lock across all packages/* members). If a Dependabot
  # run ever reports uv as unsupported on your GitHub instance, fall back to
  # "pip" here — but prefer "uv" since it matches how this repo actually
  # resolves dependencies.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"

  # `examples/vulnerable-model/` is a deliberately insecure demo fixture: it pins
  # a compromised `ultralytics` release and the loader versions that would arm the
  # poisoned `config.json` and `chat_template.jinja` next to it. Those pins ARE the
  # demo, so an "upgrade" here silently deletes the findings the example exists to
  # show. Both channels are disabled: the limit stops version updates, and the
  # wildcard `ignore` stops security updates, which run regardless of the limit.
  - package-ecosystem: "pip"
    directory: "/examples/vulnerable-model"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
