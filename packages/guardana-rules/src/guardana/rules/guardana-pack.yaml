# Generated by scripts/generate_docs.py — do not edit.
#
# The manifest for Guardana's own rule pack, which goes through the third
# party's door on purpose: a validator this repository exempted itself from
# would be a bar we ask other people to clear alone, and the first drift it
# would stop catching is our own.
#
# `provides:` is generated from the registry rather than typed, because a
# hand-maintained list of this length is how every stale count here began.
# `guardana pack validate` compares it against what the entry points really
# register, so a rule renamed in one place and not the other fails the build.
#
# Documentation: docs/usage-pack.md
# Reasoning:     docs/design/extension-author-tooling.md

schema_version: 2
name: guardana-rules

# Versioned separately from the product: in 0.x the product's minor breaks API
# by design, and a pack pinned to a product range would need re-releasing on
# every minor even when nothing it touches moved.
extension_api: ">=1,<2"

description: >
  The built-in rules: model and dependency supply chain, prompt and jailbreak
  probes, agent and MCP checks, and the trace rules that grade a recorded
  execution. Every rule maps to a public framework.

provides:
  rules:
