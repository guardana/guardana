[project]
name = "guardana-cli"
version = "0.21.0"
description = "Guardana command-line interface: scan, probe, monitor, init, rules, new-rule."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Guardana contributors", email = "maintainers@guardana.io" },
]
maintainers = [
    { name = "Guardana contributors", email = "maintainers@guardana.io" },
]
keywords = ["ai-security", "llm", "prompt-injection", "security-scanner", "mlsecops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
# `pyyaml` is declared even though `guardana-core` already brings it: this package
# imports it directly (adapter configs, baseline files), and a dependency that is
# only there transitively is one a dependant can remove without anybody noticing
# until a clean install fails.
dependencies = [
    "guardana-core>=0.21.0,<0.22",
    "guardana-rules>=0.21.0,<0.22",
    "guardana-report>=0.21.0,<0.22",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://guardana.dev"
Repository = "https://github.com/guardana/guardana"
Documentation = "https://guardana.dev"
Issues = "https://github.com/guardana/guardana/issues"
Changelog = "https://github.com/guardana/guardana/blob/main/CHANGELOG.md"

[project.scripts]
guardana = "guardana.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardana"]
