[project]
name = "guardana-cli"
version = "0.26.1"
description = "Guardana command-line interface: scan, probe, monitor, init, rules, new-rule."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Guardana contributors", email = "contact@guardana.dev" },
]
maintainers = [
    { name = "Guardana contributors", email = "contact@guardana.dev" },
]
keywords = [
    "ai-security",
    "llm-security",
    "prompt-injection",
    "security-scanner",
    "mlsecops",
    "agent-security",
    "mcp",
    "model-context-protocol",
    "red-teaming",
    "owasp",
    "mitre-atlas",
    "sarif",
    "supply-chain-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
# `pyyaml` is declared even though `guardana-core` already brings it: this package
# imports it directly (adapter configs, baseline files), and a dependency that is
# only there transitively is one a dependant can remove without anybody noticing
# until a clean install fails.
dependencies = [
    "guardana-core>=0.26.1,<0.27",
    "guardana-rules>=0.26.1,<0.27",
    "guardana-report>=0.26.1,<0.27",
    "typer>=0.27.2",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://guardana.dev"
Repository = "https://github.com/guardana/guardana"
Documentation = "https://guardana.dev/docs/"
Issues = "https://github.com/guardana/guardana/issues"
Changelog = "https://github.com/guardana/guardana/blob/main/CHANGELOG.md"

[project.scripts]
guardana = "guardana.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardana"]
