[project]
name = "guardana-server"
version = "0.22.0"
description = "Guardana collector: minimal FastAPI server that ingests and lists findings."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Guardana contributors", email = "maintainers@guardana.io" },
]
maintainers = [
    { name = "Guardana contributors", email = "maintainers@guardana.io" },
]
keywords = ["ai-security", "llm", "prompt-injection", "security-scanner", "mlsecops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
dependencies = ["fastapi>=0.115", "pydantic>=2.7", "psycopg[binary]>=3.2"]

# The ASGI server is an extra, not a dependency: FastAPI builds the application,
# and which server runs it is the deployment's decision — a site already running
# gunicorn or hypercorn should not be made to install a second one. The floor is
# the API `guardana-collector serve` actually uses, `run(app, host=, port=)`,
# which has been stable for far longer than this.
[project.optional-dependencies]
serve = ["uvicorn>=0.52.3"]

[project.urls]
Homepage = "https://guardana.dev"
Repository = "https://github.com/guardana/guardana"
Documentation = "https://guardana.dev"
Issues = "https://github.com/guardana/guardana/issues"
Changelog = "https://github.com/guardana/guardana/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardana"]

[dependency-groups]
dev = [
    "httpx>=0.27",
]

[project.scripts]
guardana-collector = "guardana.server.cli:main"
