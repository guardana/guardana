# A beta document, and pinned like one. OWASP's own identifiers carry the edition
# (`MCP01:2025`), so the scheme publishes editions and a bare `MCP01` is not a
# reference — which is what keeps a rule's claim stable when the next revision lands.
#
# `version: "0.1"` is the revision this file was transcribed from, recorded because
# the project is at "Phase 3 - Beta Release and Pilot Testing" with the next release
# expected in October 2026. Entry six is already rendered two ways in two places OWASP
# publishes; the wording below is the one in the project's own `index.md`, which is
# what the published page is generated from. When it moves, this file is not edited —
# its digest is pinned in saved runs — a new edition file is added.
scheme: OWASP-MCP
edition: "2025"
version: "0.1"
