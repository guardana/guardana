# No edition, and that is a statement rather than an omission: an ATLAS technique id
# keeps its meaning across ATLAS releases, so the release a catalogue was transcribed
# from is provenance and lands in `version`, not in the reference an auditor looks up.
# If ATLAS ever renumbers, this file gains an `edition` and every bare `AML.*`
# reference stops resolving — loudly, at load time.
#
# Sub-technique titles carry their parent so a finding reads the way ATLAS presents it.
