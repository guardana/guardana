[project]
name = "guardana-report"
version = "0.26.1"
description = "Guardana renderers: human, SARIF, JSON, and JUnit output."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Guardana contributors", email = "contact@guardana.dev" },
]
maintainers = [
    { name = "Guardana contributors", email = "contact@guardana.dev" },
]
keywords = [
    "ai-security",
    "llm-security",
    "prompt-injection",
    "security-scanner",
    "mlsecops",
    "agent-security",
    "mcp",
    "model-context-protocol",
    "red-teaming",
    "owasp",
    "mitre-atlas",
    "sarif",
    "supply-chain-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]
dependencies = ["guardana-core>=0.26.1,<0.27"]

[project.urls]
Homepage = "https://guardana.dev"
Repository = "https://github.com/guardana/guardana"
Documentation = "https://guardana.dev/docs/"
Issues = "https://github.com/guardana/guardana/issues"
Changelog = "https://github.com/guardana/guardana/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardana"]
